<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2a2b36">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__brand" href="{{ '/' | relative_url }}">
        <span class="site-header__brand-mark">WFB</span>
        <span class="site-header__brand-text">Manual &amp; FAQ</span>
      </a>
      <button class="site-header__menu-toggle" type="button" aria-label="Toggle table of contents" aria-expanded="false">
        <span class="site-header__menu-icon"></span>
      </button>
      <nav class="site-header__nav">
        <a href="https://garmin.watchfacebuilder.com">WFB site</a>
        <a href="https://garmin.watchfacebuilder.com/garmin-device-app-online-builder-help/">Help guide</a>
        <a href="https://github.com/joshuahxh/wfbInstaller/releases/latest">Installer</a>
        <a href="https://github.com/joshuahxh/wfbInstaller">GitHub</a>
      </nav>
    </div>
  </header>

  <div class="site-shell">
    <aside class="toc" aria-label="On this page">
      <div class="toc__inner">
        <p class="toc__heading">On this page</p>
        <nav class="toc__nav">
          <ol class="toc__list"></ol>
        </nav>
      </div>
    </aside>

    <main class="site-main">
      <article class="page">
        {% if page.title %}<h1 class="page__title">{{ page.title }}</h1>{% endif %}
        {{ content }}
      </article>
    </main>
  </div>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>
        Community-maintained — not an official Garmin or WFB property.
        <a href="https://github.com/joshuahxh/wfbInstaller/edit/main/docs/index.md">Edit this page on GitHub</a>
        &middot;
        <a href="https://github.com/joshuahxh/wfbInstaller/pulls">Open pull requests</a>
      </p>
    </div>
  </footer>

  <script src="{{ '/assets/js/toc.js' | relative_url }}" defer></script>
</body>
</html>
